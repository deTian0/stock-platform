# CI

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs & link check
        shell: pwsh
        run: ./scripts/check_docs.ps1

      - name: release_tag DryRun
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          ./scripts/release_tag.ps1 -Version $ver -Kind patch -Message "ci dry-run" -DryRun

  providers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/providers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install providers (editable + dev)
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
      - name: Package version matches VERSION
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          root_ver=$(tr -d '[:space:]' < VERSION)
          pkg_ver=$(python -c "import tomllib; print(tomllib.load(open('packages/providers/pyproject.toml','rb'))['project']['version'])")
          test "$root_ver" = "$pkg_ver"

  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research (editable + dev)
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
      - name: Package version matches VERSION
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          root_ver=$(tr -d '[:space:]' < VERSION)
          pkg_ver=$(python -c "import tomllib; print(tomllib.load(open('packages/research/pyproject.toml','rb'))['project']['version'])")
          test "$root_ver" = "$pkg_ver"

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install providers then workbench
        run: |
          python -m pip install -e "./packages/providers[dev]"
          python -m pip install -e "./apps/workbench[dev]"
      - name: Pytest workbench
        working-directory: apps/workbench
        run: python -m pytest -q
      - name: Workbench version matches VERSION
        shell: bash
        run: |
          root_ver=$(tr -d '[:space:]' < VERSION)
          pkg_ver=$(python -c "import tomllib; print(tomllib.load(open('apps/workbench/pyproject.toml','rb'))['project']['version'])")
          test "$root_ver" = "$pkg_ver"
