# CI

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs & link check
        shell: pwsh
        run: ./scripts/check_docs.ps1

      - name: release_tag DryRun
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          ./scripts/release_tag.ps1 -Version $ver -Kind patch -Message "ci dry-run" -DryRun
