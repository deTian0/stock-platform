[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-platform-providers"
version = "1.3.0"
description = "Unified market-data providers for stock-platform (A-share first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Pending" }
authors = [{ name = "stock-platform" }]
dependencies = []

[project.optional-dependencies]
http = ["requests>=2.28"]
dev = ["pytest>=8.0", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_platform_providers = ["py.typed", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
