[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-platform-agents"
version = "3.10.1"
description = "Thin research-agent plugins for stock-platform (no embedded market HTTP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Pending" }
authors = [{ name = "stock-platform" }]
dependencies = [
  "stock-platform-providers",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_platform_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
