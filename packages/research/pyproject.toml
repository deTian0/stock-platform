[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-platform-research"
version = "4.0.1"
description = "Selection / backtest research kernels for stock-platform (lvrev, PIT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Pending" }
authors = [{ name = "stock-platform" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.scripts]
stock-platform-score = "stock_platform_research.__main__:main"
stock-platform-brief = "stock_platform_research.brief_cli:main"
stock-platform-refresh = "stock_platform_research.refresh_cli:main"
stock-platform-daily = "stock_platform_research.daily_cli:main"
stock-platform-performance = "stock_platform_research.performance_cli:main"
stock-platform-backtest = "stock_platform_research.backtest_cli:main"
stock-platform-position-review = "stock_platform_research.position_review_cli:main"
stock-platform-market-universe = "stock_platform_research.market_universe_cli:main"
stock-platform-rankings = "stock_platform_research.rankings_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# fixtures: universe_cn_sample.json (CI) + universe_cn_daily.json (M39 layered)
stock_platform_research = ["py.typed", "fixtures/*.json", "strategy_configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
