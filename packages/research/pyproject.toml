[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-platform-research"
version = "2.0.0"
description = "Selection / backtest research kernels for stock-platform (lvrev, PIT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Pending" }
authors = [{ name = "stock-platform" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.scripts]
stock-platform-score = "stock_platform_research.__main__:main"
stock-platform-brief = "stock_platform_research.brief_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_platform_research = ["py.typed", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
